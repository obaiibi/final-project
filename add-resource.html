<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Add a new study resource to StudyBud.">
  <title>StudyBud | Add Resource</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo">
      <h1>📚 StudyBud</h1>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Explore Resources</a></li>
        <li><a href="add-resource.html" class="active">Add Resource</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="form-section">
      <div class="form-banner">
        <img src="images/study-desk.jpg" alt="Study Desk Setup" class="form-img">
      </div>
      <h2>Share a Study Resource</h2>
      <p>Fill out the form below to contribute to the student hub.</p>

      <!-- Feedback Alert Box -->
      <div id="messageBox" class="alert-box" hidden></div>

      <!-- User Input Form -->
      <form id="resourceForm" novalidate>
        <div class="form-group">
          <label for="title">Resource Title *</label>
          <input type="text" id="title" name="title" placeholder="e.g., Midterm Cheat Sheet">
          <small class="error-text" id="titleError"></small>
        </div>

        <div class="form-group">
          <label for="course">Course Code *</label>
          <input type="text" id="course" name="course" placeholder="e.g., CS101 or MATH202">
          <small class="error-text" id="courseError"></small>
        </div>

        <div class="form-group">
          <label for="category">Category *</label>
          <select id="category" name="category">
            <option value="">-- Select Category --</option>
            <option value="Lecture Notes">Lecture Notes</option>
            <option value="Study Guide">Study Guide</option>
            <option value="Practice Quiz">Practice Quiz</option>
            <option value="Cheatsheet">Cheatsheet</option>
          </select>
          <small class="error-text" id="categoryError"></small>
        </div>

        <div class="form-group">
          <label for="link">Resource URL *</label>
          <input type="url" id="link" name="link" placeholder="https://example.com/notes.pdf">
          <small class="error-text" id="linkError"></small>
        </div>

        <div class="form-group">
          <label for="description">Short Description *</label>
          <textarea id="description" name="description" rows="4" placeholder="Briefly explain what this resource covers..."></textarea>
          <small class="error-text" id="descriptionError"></small>
        </div>

        <button type="submit" id="submitBtn">Submit Resource</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 StudyBud Project. Developed for Web Development Assessment.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
