<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="StudyBud - Discover and share study resources for your courses.">
  <title>StudyBud | Resource Explorer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Semantic Navigation Header -->
  <header>
    <div class="logo">
      <h1>📚 StudyBud</h1>
    </div>
    <nav>
      <ul>
        <li><a href="index.html" class="active">Explore Resources</a></li>
        <li><a href="add-resource.html">Add Resource</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main Content Area -->
  <main>
    <section class="hero">
      <div class="hero-image-container">
        <img src="images/hero-banner.jpg" alt="StudyBud Campus Resource Banner" class="hero-img">
      </div>
      <h2>Campus Study Resource Hub</h2>
      <p>Find peer-recommended notes, guides, and study links for your courses.</p>
    </section>

    <!-- Search and Filter Section -->
    <section class="controls-section">
      <div class="search-box">
        <label for="searchInput" class="sr-only">Search resources</label>
        <input type="text" id="searchInput" placeholder="Search by topic or course code (e.g. CS101)...">
      </div>
      <div class="filter-box">
        <label for="categoryFilter" class="sr-only">Filter by category</label>
        <select id="categoryFilter">
          <option value="All">All Categories</option>
          <option value="Lecture Notes">Lecture Notes</option>
          <option value="Study Guide">Study Guide</option>
          <option value="Practice Quiz">Practice Quiz</option>
          <option value="Cheatsheet">Cheatsheet</option>
        </select>
      </div>
    </section>

    <!-- Dynamic Resource Grid -->
    <section class="resource-container">
      <h3>Available Resources</h3>
      <div id="resourceGrid" class="grid-container">
        <!-- JS dynamically populates card content here -->
      </div>
    </section>
  </main>

  <!-- Semantic Footer -->
  <footer>
    <p>&copy; 2026 StudyBud Project. Developed for Web Development Assessment.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
